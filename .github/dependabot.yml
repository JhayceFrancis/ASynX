updates:
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Maintain Node.js / Bun dependencies
  - package-ecosystem: "npm" 
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "bun"
    
    # Custom grouping based on the ASynX architecture
    groups:
      desktop-environment:
        patterns:
          - "electron"
          - "electron-builder"
          - "concurrently"
          - "wait-on"
          
      core-ui-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "lucide-react"
          - "motion"
          - "recharts"
          
      build-and-styling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "esbuild"
          
      backend-and-types:
        patterns:
          - "express"
          - "cors"
          - "dotenv"
          - "typescript"
          - "tsx"
          - "@types/*"
          
      ai-integration:
        patterns:
          - "@google/genai"
