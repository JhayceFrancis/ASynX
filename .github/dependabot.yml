version: 2
updates:
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    reviewers:
      - "JhayceFrancis"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Maintain npm / Node.js & Desktop dependencies
  - package-ecosystem: "npm" 
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    reviewers:
      - "JhayceFrancis"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      
    # Ignore major version bumps for risky architectural packages
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

    # Custom grouping based on ASynX package.json architecture
    groups:
      core-ui-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "lucide-react"
          - "motion"
          - "recharts"
          
      build-and-styling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "esbuild"
          
      backend-and-types:
        patterns:
          - "express"
          - "cors"
          - "dotenv"
          - "typescript"
          - "tsx"
          - "@types/*"
          - "express-rate-limit"

      desktop-electron:
        patterns:
          - "electron"
          - "electron-builder"
          - "concurrently"
          - "wait-on"
          
      ai-integration:
        patterns:
          - "@google/genai"