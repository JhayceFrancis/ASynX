name: Publish ASynX Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow exclusively on version tags (e.g., v2.4.0-beta.1)
  workflow_dispatch: # Allows manual release trigger from GitHub Actions interface

permissions:
  contents: write # Required for electron-builder to draft and upload assets to GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Dependencies
        run: npm ci --include=optional || npm install --include=optional

      - name: Patch Native & Optional Windows Binaries
        run: |
          npm install --no-save --force @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc @esbuild/win32-x64

      - name: Verify Type Safety
        run: npm run lint

      - name: Build Application Assets
        run: npm run build
        
      - name: Package and Publish with Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish always
