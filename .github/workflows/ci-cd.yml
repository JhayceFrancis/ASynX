name: ASynX Master CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'asynx-win-v*.*.*'
      - 'asynx-docker-v*.*.*'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write 
  packages: write 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Version Bumper
  # ==========================================
  bump-version:
    name: Bump Release Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version and Push
        run: |
          npm version patch --no-git-tag-version
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore(release): bump version [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main

  # ==========================================
  # JOB 2: Windows Electron (.exe) Publisher
  # ==========================================
  build-electron:
    name: Build & Publish Electron Installer
    needs: bump-version
    # Only run if triggered by main branch, workflow dispatch, or the 'win' tag
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/asynx-win-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main # Explicitly pulls the newly bumped version

      - name: Setup Node.js (v24 LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Dependencies
        run: |
          npm install --include=optional --no-audit --no-fund
          npx electron-builder install-app-deps

      - name: Patch Native & Optional Windows Binaries
        run: |
          npm install --no-save --force @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc @esbuild/win32-x64

      - name: Verify Type Safety
        run: npm run lint

      - name: Build Application Assets
        run: npm run build
        
      - name: Package with Electron Builder (No Publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Extract Version
        id: version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create Unified GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: asynx-win-v${{ env.VERSION }}
          name: ASynX Windows v${{ env.VERSION }}
          draft: true
          prerelease: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 3: Ubuntu Docker (GHCR) Publisher
  # ==========================================
  build-docker:
    name: Build & Push Docker Image
    needs: bump-version
    # Only run if triggered by main branch, workflow dispatch, or the 'docker' tag
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/asynx-docker-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main # Explicitly pulls the newly bumped version

      - name: Extract Version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Lowercase Repository Owner
        id: lower_owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/asynx:latest
            ghcr.io/${{ env.OWNER }}/asynx:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
