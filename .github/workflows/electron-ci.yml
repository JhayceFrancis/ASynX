name: "ASynX CI - Headless Electron & Build Test"

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-desktop-app:
    name: Headless Electron Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Build Verification
        run: npm run build

      - name: Run Headless Electron Smoke Test
        uses: coactions/setup-xvfb@v1
        with:
          run: |
            npm run start &
            SERVER_PID=$!
            npx wait-on -t 20000 tcp:3000
            timeout 10 npx electron . --no-sandbox || [ $? -eq 124 ]
            kill $SERVER_PID || true
