name: Build and Package Browser Extension (Chrome, Edge & Safari)

on:
  push:
    tags:
      - 'asynx-brwsr_plg-v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Publish as Draft or Public Release?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: Build Web Assets & Package Chromium (Chrome & Edge)
  # =========================================================================
  build-web-extensions:
    name: Build Chrome, Edge & Safari Web Bundles
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Extract Version & Define Release Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/asynx-brwsr_plg-v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#asynx-brwsr_plg-v}"
          else
            VERSION=$(node -p "require('./package.json').version")
            RAW_TAG="asynx-brwsr_plg-v${VERSION}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RAW_TAG}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Build Extension Source
        run: |
          if npm run | grep -q "build:extension"; then
            npm run build:extension
          else
            npm run build
          fi

          mkdir -p dist-extension-raw
          if [ -d "dist-extension" ] && [ "$(ls -A dist-extension)" ]; then
            cp -r dist-extension/* dist-extension-raw/
            rm -rf dist-extension
          elif [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* dist-extension-raw/
          fi

          # Ensure manifest.json is present in the raw bundle
          if [ ! -f "dist-extension-raw/manifest.json" ] && [ -f "public/manifest.json" ]; then
            cp public/manifest.json dist-extension-raw/manifest.json
          fi

      - name: Generate Optimised Chrome/Edge & Safari Manifests
        run: node scripts/prepare-manifests.cjs

      - name: Package Chrome & Edge Archive
        run: |
          cd dist-extension/chromium
          zip -r ../../asynx-extension-chrome-edge-v${{ env.VERSION }}.zip ./*
          cd ../..

      - name: Upload Chrome & Edge Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-edge-extension
          path: asynx-extension-chrome-edge-v${{ env.VERSION }}.zip

      - name: Upload Raw Safari Web Bundle for macOS Runner
        uses: actions/upload-artifact@v4
        with:
          name: safari-web-bundle
          path: dist-extension/safari

  # =========================================================================
  # JOB 2: Convert & Compile Native Safari Extension (.app) on macOS
  # =========================================================================
  build-safari-macos:
    name: Build Native Safari Extension (macOS Xcode)
    needs: build-web-extensions
    runs-on: macos-latest

    steps:
      - name: Download Safari Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: safari-web-bundle
          path: ./safari-web-bundle

      - name: Convert Web Extension to Safari Xcode Project
        run: |
          xcrun safari-web-extension-converter ./safari-web-bundle \
            --project-location ./safari-xcode \
            --app-name "ASynX" \
            --bundle-identifier "net.itsjc.asynx.extension" \
            --macos-only \
            --no-open \
            --no-prompt

      - name: Compile Unsigned Safari macOS App Bundle
        run: |
          xcodebuild -project "./safari-xcode/ASynX/ASynX.xcodeproj" \
            -scheme "ASynX (macOS)" \
            -configuration Release \
            -derivedDataPath ./safari-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Safari .app into Release Zip
        run: |
          cd ./safari-build/Build/Products/Release
          zip -r ../../../../asynx-extension-safari-macos-v${{ needs.build-web-extensions.outputs.version }}.zip "ASynX.app"

      - name: Upload Compiled Safari Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari-macos-extension
          path: asynx-extension-safari-macos-v${{ needs.build-web-extensions.outputs.version }}.zip

  # =========================================================================
  # JOB 3: Tag Repository & Publish Unified GitHub Release
  # =========================================================================
  publish-release:
    name: Tag & Publish Multi-Browser Release
    needs: [build-web-extensions, build-safari-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download All Browser Packages
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Tag and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-web-extensions.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ASynX Browser Plugin v${{ needs.build-web-extensions.outputs.version }} (Chrome, Edge & Safari)
          draft: ${{ github.event.inputs.release_type == 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            ./release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
