name: Build and Package Extension (Chrome & Edge)

on:
  push:
    tags:
      - 'asynx-brwsr_plg-v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Publish as Draft or Public Release?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build-chromium-extension:
    name: Build & Package for Chrome & Edge
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Extract Version & Define Release Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/asynx-brwsr_plg-v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#asynx-brwsr_plg-v}"
          else
            VERSION=$(node -p "require('./package.json').version")
            RAW_TAG="asynx-brwsr_plg-v${VERSION}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RAW_TAG}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Synchronise manifest.json Version
        run: |
          if [ -f "public/manifest.json" ]; then
            node -e "
              const fs = require('fs');
              const manifestPath = 'public/manifest.json';
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              manifest.version = process.env.VERSION;
              fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            "
          fi

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Build Extension Source
        run: |
          if npm run | grep -q "build:extension"; then
            npm run build:extension
          else
            npm run build
          fi

          mkdir -p dist-extension
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* dist-extension/
          elif [ -d "dist-extension-raw" ] && [ "$(ls -A dist-extension-raw)" ]; then
            cp -r dist-extension-raw/* dist-extension/
          fi

          if [ ! -f "dist-extension/manifest.json" ] && [ -f "public/manifest.json" ]; then
            cp public/manifest.json dist-extension/manifest.json
          fi

      - name: Package Chromium Extension (.zip)
        run: |
          cd dist-extension
          # Ensure localhost permissions are included for the store-ready build
          node -e "
            const fs = require('fs');
            if (fs.existsSync('manifest.json')) {
              const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
              m.host_permissions = Array.from(new Set([...(m.host_permissions || []), 'http://localhost:14000/*', 'http://127.0.0.1:14000/*']));
              fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2));
            }
          "
          zip -r ../asynx-browser-extension-chrome-edge-v${{ env.VERSION }}.zip ./*
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asynx-browser-extension-chrome-edge-v${{ env.VERSION }}
          path: asynx-browser-extension-chrome-edge-v${{ env.VERSION }}.zip

  publish-release:
    name: Publish GitHub Release
    needs: build-chromium-extension
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          # Use the output from the previous job instead of the empty local env variable
          name: asynx-browser-extension-chrome-edge-v${{ needs.build-chromium-extension.outputs.version }}

      - name: Create Tag and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-chromium-extension.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ASynX Browser Plugin v${{ needs.build-chromium-extension.outputs.version }} (Chrome & Edge)
          draft: ${{ github.event.inputs.release_type == 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            asynx-browser-extension-chrome-edge-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
